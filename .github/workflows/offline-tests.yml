name: Offline core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Accounting, provenance and dashboard regressions
        run: |
          python -m unittest discover -s tests -p 'test_paper_ledger.py'
          python -m unittest discover -s tests -p 'test_control_plane_store.py'
          python -m unittest discover -s tests -p 'test_btc_bracket_engine.py'
          python -m unittest discover -s operations/visual_dashboard -p 'test_server.py'
      - name: Synthetic four-desk rehearsal
        run: python -m neorome.paper_rehearsal --output-dir "${RUNNER_TEMP}/neorome-rehearsal"
